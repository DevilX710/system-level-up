   SYSTEM MESSAGE

   RESET

<div class="xp-box">

        <span>

    <div class="xp-bar">

        <div

        </div>

</div>

<div class="section">

<div class="section-title">

<div id="tasks"></div>

<div class="input-row">

    <input
        id="taskInput"
        placeholder="Enter a new quest...">

    <button
        class="add-btn"
        onclick="addTask()">

    </button>

</div>

</div>

<div class="section">

<div class="section-title">

</div>

<div class="panel">

        <input
            id="reminderInput"
            placeholder="Reminder title">

    <div class="input-row">

        <input
            id="reminderDate"

        <input
            id="reminderTime"

    <div class="input-row">

        <input
            id="reminderNote"
            placeholder="Optional note">

            class="add-btn"
            onclick="addReminder()">

        </button>

<script>

/* =====================================================
   DATA
===================================================== */

let data =
JSON.parse(
    localStorage.getItem("systemData")
)
||
{
    xp: 0,
    totalXP: 0,
    level: 1,

    completed: 0,

    streak: 0,

    lastComplete: "",

    tasks: [],

    reminders: [],

    goals: [],

    notes: "",

    budget: 0,

    expenses: []
};


/* =====================================================
   SAVE
===================================================== */

function save() {

    localStorage.setItem(
        "systemData",
        JSON.stringify(data)
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

    document.getElementById(
        "message"
    ).innerText = text;

}


/* =====================================================
   XP
===================================================== */

function addXP(amount) {

    data.xp += amount;

    data.totalXP += amount;

    let needed =
        data.level * 100;


    while (data.xp >= needed) {

        data.xp -= needed;

        data.level++;

        needed =
            data.level * 100;

        showMessage(
            "LEVEL UP! YOU REACHED LEVEL "
            + data.level
        );

    }


    save();

    render();

}


/* =====================================================
   QUESTS
===================================================== */

function addTask() {

    let input =
        document.getElementById(
            "taskInput"
        );

    let name =
        input.value.trim();


    if (!name)
        return;


    data.tasks.push({

        name: name,

        completed: false,

        xp: 25

    });


    input.value = "";

    save();

    render();

}


function completeTask(index) {

    let task =
        data.tasks[index];


    if (task.completed)
        return;


    task.completed = true;

    data.completed++;

    updateStreak();

    addXP(task.xp);


    showMessage(
        "QUEST COMPLETE  +"
        + task.xp
        + " XP"
    );


    save();

    render();

}


/* =====================================================
   STREAK
===================================================== */

function updateStreak() {

    let today =
        new Date().toDateString();


    if (
        data.lastComplete !== today
    ) {

        data.streak++;

        data.lastComplete =
            today;

    }

}


/* =====================================================
   REMINDERS
===================================================== */

function addReminder() {

    let title =
        document.getElementById(
            "reminderInput"
        ).value.trim();


    let date =
        document.getElementById(
            "reminderDate"
        ).value;


    let time =
        document.getElementById(
            "reminderTime"
        ).value;


    let note =
        document.getElementById(
            "reminderNote"
        ).value.trim();


    if (
        !title ||
        !date ||
        !time
    )
        return;


    data.reminders.push({

        title: title,

        date: date,

        time: time,

        note: note

    });


    document.getElementById(
        "reminderInput"
    ).value = "";


    document.getElementById(
        "reminderDate"
    ).value = "";


    document.getElementById(
        "reminderTime"
    ).value = "";


    document.getElementById(
        "reminderNote"
    ).value = "";


    save();

    render();


    showMessage(
        "REMINDER REGISTERED."
    );

}


function deleteReminder(index) {

    data.reminders.splice(
        index,
        1
    );

    save();

    render();

}


/* =====================================================
   GOALS
===================================================== */

function addGoal() {

    let name =
        document.getElementById(
            "goalInput"
        ).value.trim();


    let target =
        Number(
            document.getElementById(
                "goalTarget"
            ).value
        );


    if (
        !name ||
        target <= 0
    )
        return;


    data.goals.push({

        name: name,

        current: 0,

        target: target

    });


    document.getElementById(
        "goalInput"
    ).value = "";


    document.getElementById(
        "goalTarget"
    ).value = "";


    save();

    render();

}


function increaseGoal(index) {

    let goal =
        data.goals[index];


    if (
        goal.current >=
        goal.target
    )
        return;


    goal.current++;

    addXP(10);


    if (
        goal.current ===
        goal.target
    ) {

        showMessage(
            "GOAL COMPLETED!"
        );

    }


    save();

    render();

}


function decreaseGoal(index) {

    let goal =
        data.goals[index];


    if (
        goal.current > 0
    ) {

        goal.current--;

    }


    save();

    render();

}


/* =====================================================
   NOTES
===================================================== */

function saveNotes() {

    data.notes =
        document.getElementById(
            "notes"
        ).value;


    save();


    document.getElementById(
        "noteStatus"
    ).innerText =
        "✓ NOTES SAVED OFFLINE.";


    showMessage(
        "NOTES SAVED."
    );

}


/* =====================================================
   BUDGET
===================================================== */

function setBudget() {

    let amount =
        Number(
            document.getElementById(
                "budgetInput"
            ).value
        );


    if (amount <= 0)
        return;


    data.budget =
        amount;


    document.getElementById(
        "budgetInput"
    ).value = "";


    save();

    render();


    showMessage(
        "BUDGET UPDATED."
    );

}


function addExpense() {

    let name =
        document.getElementById(
            "expenseName"
        ).value.trim();


    let amount =
        Number(
            document.getElementById(
                "expenseAmount"
            ).value
        );


    if (
        !name ||
        amount <= 0
    )
        return;


    data.expenses.push({

        name: name,

        amount: amount

    });


    document.getElementById(
        "expenseName"
    ).value = "";


    document.getElementById(
        "expenseAmount"
    ).value = "";


    save();

    render();


    showMessage(
        "EXPENSE RECORDED."
    );

}


function deleteExpense(index) {

    data.expenses.splice(
        index,
        1
    );

    save();

    render();

}


/* =====================================================
   RENDER
===================================================== */

function render() {


    /* LEVEL */

    document.getElementById(
        "level"
    ).innerText =
        data.level;


    /* XP */

    let needed =
        data.level * 100;


    document.getElementById(
        "xp"
    ).innerText =
        data.xp;


    document.getElementById(
        "xpNeeded"
    ).innerText =
        needed;


    document.getElementById(
        "xpFill"
    ).style.width =
        (
            data.xp /
            needed *
            100
        )
        + "%";


    /* TASKS */

    let tasks =
        document.getElementById(
            "tasks"
        );


    tasks.innerHTML = "";


    data.tasks.forEach(
        function(task,index) {

            let div =
                document.createElement(
                    "div"
                );


            div.className =
                "task "
                +
                (
                    task.completed
                    ?
                    "completed"
                    :
                    ""
                );


            div.innerHTML = `

                <button
                    class="check"
                    onclick="completeTask(${index})">

                    ${
                        task.completed
                        ?
                        "✓"
                        :
                        ""
                    }

                </button>


                <div class="task-name">

                    ${escapeHTML(
                        task.name
                    )}

                </div>


                <div class="xp-reward">

                    +${task.xp}

                </div>

            `;


            tasks.appendChild(div);

        }
    );


    /* REMINDERS */

    let reminders =
        document.getElementById(
            "reminders"
        );


    reminders.innerHTML = "";


    data.reminders.forEach(
        function(reminder,index) {

            let div =
                document.createElement(
                    "div"
                );


            div.className =
                "reminder";


            div.innerHTML = `

                <div class="reminder-top">

                    <div class="reminder-name">

                        ${escapeHTML(
                            reminder.title
                        )}

                    </div>


                    <div class="reminder-time">

                        ${reminder.date}
                        ·
                        ${reminder.time}

                    </div>

                </div>


                ${
                    reminder.note
                    ?
                    `
                    <div class="reminder-note">

                        ${escapeHTML(
                            reminder.note
                        )}

                    </div>
                    `
                    :
                    ""
                }


                <br>


                <button
                    class="small-btn"
                    onclick="deleteReminder(${index})">

                    REMOVE

                </button>

            `;


            reminders.appendChild(
                div
            );

        }
    );


    /* GOALS */

    let goals =
        document.getElementById(
            "goals"
        );


    goals.innerHTML = "";


    data.goals.forEach(
        function(goal,index) {

            let percentage =
                Math.min(
                    goal.current /
                    goal.target *
                    100,
                    100
                );


            let div =
                document.createElement(
                    "div"
                );


            div.className =
                "goal";


            div.innerHTML = `

                <div class="goal-header">

                    <div class="goal-name">

                        ${escapeHTML(
                            goal.name
                        )}

                    </div>


                    <div class="goal-count">

                        ${goal.current}
                        /
                        ${goal.target}

                    </div>

                </div>


                <div class="goal-bar">

                    <div
                        class="goal-fill"
                        style="width:${percentage}%">
                    </div>

                </div>


                <div class="goal-buttons">

                    <button
                        onclick="decreaseGoal(${index})">

                        −

                    </button>


                    <button
                        onclick="increaseGoal(${index})">

                        +1

                    </button>

                </div>

            `;


            goals.appendChild(
                div
            );

        }
    );


    /* NOTES */

    document.getElementById(
        "notes"
    ).value =
        data.notes;


    /* BUDGET */

    let spent =
        data.expenses.reduce(
            function(sum,item) {

                return sum +
                    item.amount;

            },
            0
        );


    let remaining =
        data.budget -
        spent;


    document.getElementById(
        "budgetTotal"
    ).innerText =
        "৳" +
        data.budget;


    document.getElementById(
        "budgetSpent"
    ).innerText =
        "৳" +
        spent;


    document.getElementById(
        "budgetRemaining"
    ).innerText =
        "৳" +
        remaining;


    /* EXPENSES */

    let expenses =
        document.getElementById(
            "expenses"
        );


    expenses.innerHTML = "";


    data.expenses.forEach(
        function(expense,index) {

            let div =
                document.createElement(
                    "div"
                );


            div.className =
                "expense";


            div.innerHTML = `

                <div class="expense-name">

                    ${escapeHTML(
                        expense.name
                    )}

                </div>


                <div>

                    <span
                        class="expense-amount">

                        − ৳${expense.amount}

                    </span>


                    &nbsp;


                    <button
                        class="small-btn"
                        onclick="deleteExpense(${index})">

                        ×

                    </button>

                </div>

            `;


            expenses.appendChild(
                div
            );

        }
    );


    /* STATS */

    document.getElementById(
        "completed"
    ).innerText =
        data.completed;


    document.getElementById(
        "streak"
    ).innerText =
        data.streak;


    document.getElementById(
        "totalXP"
    ).innerText =
        data.totalXP;

}

function escapeHTML(text) {

    let div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
